{{ extends "global/Page.html" }}
{{ block title }} {{ endblock }}

{{ block content }}
<!-- 
此檔案功能：收集參與者的 Prolific ID
這是 oTree 的 Page 模板，用於收集文字輸入
-->

<style>
    /* 新增：整頁標題字體 */
    .pid-page-title {
        font-family: 'Times New Roman', serif;
        font-size: 24px;      /* 這裡改標題大小 */
        font-weight: bold;
        margin-bottom: 18px;
        text-align: center;     /* 想置中就改成 center */
    }

    /* 問題 label 的字體大小（What is your Prolific ID? 這一行） */
    .otree-form .control-label {
        font-family: 'Times New Roman', serif;
        font-size: 24px;
        font-weight: bold;
    }

    /* Prolific ID 輸入框本身的字體大小 */
    .otree-form input[name="prolific_ID"] {
        font-family: 'Times New Roman', serif;
        font-size: 20px;
        padding: 10px;
        border: 2px solid #ccc;
        border-radius: 4px;
        transition: border-color 0.3s;
    }
    
    /* 輸入框聚焦時的樣式 */
    .otree-form input[name="prolific_ID"]:focus {
        outline: none;
        box-shadow: 0 0 5px rgba(0, 123, 255, 0.3);
    }
    
    /* 提示文字 */
    .pid-hint {
        font-family: 'Times New Roman', serif;
        font-size: 16px;
        font-style: italic;
        margin-top: 8px;
        color: #666;
    }
    
    /* 警告訊息樣式 */
    .pid-warning {
        font-family: 'Times New Roman', serif;
        font-size: 16px;
        color: #dc3545;
        background-color: #f8d7da;
        border: 1px solid #f5c6cb;
        border-radius: 4px;
        padding: 12px;
        margin-top: 15px;
        display: none;
    }
    
    .pid-warning.show {
        display: block;
    }
</style>

<!-- 新增：頁面標題 -->
<div class="pid-page-title">
    Prolific ID
</div>

{{ formfields }}

<p class="pid-hint">
    Please note that this response should auto-fill with the correct ID.
</p>

<div id="pid-warning" class="pid-warning">
    ⚠ Please enter your Prolific ID before continuing.
</div>

<script>
(function () {
    function getParam(name) {
        const url = new URL(window.location.href);
        return url.searchParams.get(name);
    }
    const pid =
        getParam('PROLIFIC_PID') ||
        getParam('prolific_pid') ||
        getParam('prolific_ID') ||
        getParam('participant_label') ||
        getParam('ParticipantLabel');
    if (!pid) return;
    const input = document.querySelector('input[name="prolific_ID"]');
    if (input && !input.value) {
        input.value = pid;
    }
})();

// 添加即時驗證提示
document.addEventListener('DOMContentLoaded', function() {
    const input = document.querySelector('input[name="prolific_ID"]');
    const warning = document.getElementById('pid-warning');
    const form = document.querySelector('form');
    
    if (input) {
        // 移除 HTML5 原生驗證，改用自訂驗證
        input.removeAttribute('required');
        
        // 當用戶嘗試提交空白表單時顯示警告
        if (form) {
            // 先移除表單的 novalidate 屬性（如果有的話）
            form.setAttribute('novalidate', 'novalidate');
            
            form.addEventListener('submit', function(e) {
                console.log('提交表單，檢查值：', input.value); // 調試用
                
                if (!input.value || input.value.trim() === '') {
                    console.log('值為空，阻止提交'); // 調試用
                    e.preventDefault();
                    e.stopPropagation();
                    e.stopImmediatePropagation();
                    
                    // 顯示紅色邊框
                    input.style.borderColor = '#dc3545';
                    input.style.borderWidth = '2px';
                    input.style.borderStyle = 'solid';
                    
                    // 顯示警告訊息
                    warning.classList.add('show');
                    warning.style.display = 'block';
                    
                    // 捲動到輸入框位置
                    setTimeout(function() {
                        const yOffset = -150;
                        const element = input;
                        const y = element.getBoundingClientRect().top + window.pageYOffset + yOffset;
                        window.scrollTo({top: y, behavior: 'smooth'});
                        
                        // 聚焦輸入框
                        setTimeout(function() {
                            input.focus();
                        }, 300);
                    }, 50);
                    
                    return false;
                } else {
                    console.log('值不為空，允許提交'); // 調試用
                }
            }, true); // 使用捕獲階段
        }
        
        // 當用戶輸入時更新邊框顏色
        input.addEventListener('input', function() {
            if (input.value && input.value.trim() !== '') {
                // 有內容：顯示綠色邊框
                input.style.borderColor = '#28a745';
                input.style.borderWidth = '2px';
                input.style.borderStyle = 'solid';
                warning.classList.remove('show');
                warning.style.display = 'none';
            } else {
                // 清空內容：恢復預設顏色
                input.style.borderColor = '#ccc';
                input.style.borderWidth = '2px';
                input.style.borderStyle = 'solid';
            }
        });
        
        // 檢查初始值（如果有自動填入）
        if (input.value && input.value.trim() !== '') {
            input.style.borderColor = '#28a745';
            input.style.borderWidth = '2px';
            input.style.borderStyle = 'solid';
        }
    }
});
</script>
