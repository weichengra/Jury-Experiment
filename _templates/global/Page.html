<!--
    全域頁面模板 (Global Page Template)
    
    【功能說明】
    本模板為所有頁面的基礎模板，包含：
    1. 全域樣式表 (styles.css)
    2. Slider 工具函數 (slider.js)
    3. 螢幕寬度檢測（阻擋手機用戶，最小 1024px）
    4. 表單驗證增強（自動捲動到錯誤欄位）
    5. 滑鼠軌跡追蹤系統
    
    【滑鼠追蹤功能】
    - 記錄滑鼠移動（每秒節流）
    - 記錄點擊事件
    - 記錄頁面可見性變化
    - 自動同步到 mouse_tracking_data 欄位
    - 完全隱藏 oTree 渲染的欄位及其包裝元素
    
    【使用方式】
    各頁面 HTML 使用 extends "global/Page.html" 繼承此模板
    
    
-->
{% extends "otree/Page.html" %}
{% load otree %}

{% block global_styles  %}
<link rel="stylesheet" href="{% static 'global/styles.css' %}">
{% endblock %}

{% block global_scripts  %}
<script src="{% static 'global/slider.js' %}"></script>
<script>
    // ============================================
    // 螢幕寬度檢測：阻止手機用戶參與
    // 最小寬度要求：1024px（確保在桌面環境作答）
    // ============================================
    (function checkScreenWidth() {
        const MIN_WIDTH = 1024;
        const screenWidth = window.innerWidth || document.documentElement.clientWidth;
        
        if (screenWidth < MIN_WIDTH) {
            const overlay = document.createElement('div');
            overlay.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0, 0, 0, 0.95);
                z-index: 10000;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            `;
            
            const message = document.createElement('div');
            message.style.cssText = `
                background: white;
                padding: 30px;
                border-radius: 10px;
                max-width: 500px;
                text-align: center;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            `;
            
            message.innerHTML = `
                <h2 style="color: #d32f2f; margin-bottom: 20px;">螢幕尺寸不符合要求</h2>
                <p style="font-size: 16px; line-height: 1.6; margin-bottom: 15px;">
                    此問卷需要使用<strong>桌上型電腦或筆記型電腦</strong>完成。
                </p>
                <p style="font-size: 14px; color: #666; margin-bottom: 20px;">
                    您目前的螢幕寬度：${screenWidth}px<br>
                    最低要求：${MIN_WIDTH}px
                </p>
                <p style="font-size: 14px; color: #666;">
                    請使用電腦重新開啟此連結。
                </p>
            `;
            
            overlay.appendChild(message);
            document.body.appendChild(overlay);
            
            document.addEventListener('submit', function(e) {
                e.preventDefault();
                e.stopPropagation();
                return false;
            }, true);
            
            setTimeout(function() {
                const buttons = document.querySelectorAll('button, input[type="submit"]');
                const inputs = document.querySelectorAll('input, select, textarea');
                buttons.forEach(btn => btn.disabled = true);
                inputs.forEach(input => input.disabled = true);
            }, 100);
        }
    })();

    // ============================================
    // 表單驗證增強
    // 自動顯示驗證錯誤訊息並捲動到第一個錯誤欄位
    // ============================================
    document.addEventListener('DOMContentLoaded', function () {
        const inputs = document.querySelectorAll('input, select, textarea');
        inputs.forEach(input => {
            input.addEventListener('invalid', function (e) {
                if (input.validity.valueMissing) {
                    input.setCustomValidity('Please answer all questions.');
                }
                // 阻止預設行為，避免瀏覽器自動捲動到頂部
                e.preventDefault();
            });
            input.addEventListener('input', function () {
                input.setCustomValidity('');
                if (input.type === 'radio' && input.name) {
                    const radios = document.querySelectorAll(`input[name="${input.name}"]`);
                    radios.forEach(r => r.setCustomValidity(''));
                }
            });
            input.addEventListener('change', function () {
                input.setCustomValidity('');
                if (input.type === 'radio' && input.name) {
                    const radios = document.querySelectorAll(`input[name="${input.name}"]`);
                    radios.forEach(r => r.setCustomValidity(''));
                }
            });
        });

        const form = document.querySelector('form');
        if (form) {
            form.addEventListener('submit', function(event) {
                // 檢查表單是否有效
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                    
                    // 找到第一個無效的欄位
                    let firstInvalid = null;
                    
                    // 先檢查所有必填的 radio button 組
                    const radioGroups = {};
                    form.querySelectorAll('input[type="radio"][required]').forEach(radio => {
                        if (!radioGroups[radio.name]) {
                            radioGroups[radio.name] = radio;
                        }
                    });
                    
                    for (let name in radioGroups) {
                        const radios = form.querySelectorAll(`input[name="${name}"]`);
                        const checked = Array.from(radios).some(r => r.checked);
                        if (!checked) {
                            if (!firstInvalid) {
                                firstInvalid = radios[0];
                            }
                            radios.forEach(r => r.setCustomValidity('Please answer all questions.'));
                        }
                    }
                    
                    // 如果沒有找到無效的 radio，檢查其他無效欄位
                    if (!firstInvalid) {
                        firstInvalid = form.querySelector(':invalid');
                    }
                    
                    // 捲動到第一個無效欄位
                    if (firstInvalid) {
                        // 捲動到欄位位置，並留出一些頂部空間
                        const yOffset = -100; // 往上偏移100px，確保問題可見
                        const element = firstInvalid;
                        const y = element.getBoundingClientRect().top + window.pageYOffset + yOffset;
                        
                        window.scrollTo({top: y, behavior: 'smooth'});
                        
                        // 延遲聚焦和顯示錯誤訊息，確保捲動完成
                        setTimeout(function() {
                            if (firstInvalid.type === 'radio') {
                                // 對於 radio button，顯示驗證訊息
                                firstInvalid.reportValidity();
                            } else {
                                firstInvalid.focus();
                                firstInvalid.reportValidity();
                            }
                        }, 500);
                    }
                    
                    return false;
                }
            }, true); // 使用捕獲階段，確保在其他事件之前執行
        }
    });
</script>

<!--
    ============================================
    滑鼠軌跡追蹤系統
    ============================================
    
    【功能】
    記錄每個頁面的滑鼠行為，包括：
    - 滑鼠移動位置（每秒記錄一次，避免資料過大）
    - 點擊事件（包含座標和按鈕）
    - 頁面可見性變化（切換分頁、最小化視窗）
    
    【資料格式】
    JSON 陣列，每個事件包含：
    {
        t: 時間戳（秒，相對於頁面載入）,
        x: 滑鼠 X 座標,
        y: 滑鼠 Y 座標,
        sx: 頁面水平捲動位置,
        sy: 頁面垂直捲動位置,
        event: 事件類型（move/click/page_hidden/page_visible）,
        button: 滑鼠按鈕（0=左鍵，1=中鍵，2=右鍵）
    }
    
    【儲存機制】
    - 每個頁面將資料儲存到 mouse_tracking_data 欄位
    - 提交時由 Python 後端複製到對應的頁面專用欄位
    - 優先使用 oTree 自動渲染的欄位（避免 formfields 衝突）
    - 完全隱藏 oTree 渲染的欄位及其包裝元素（避免顯示在頁面上）
-->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const start = performance.now();
        const data = [];
        let lastMove = 0;

        const form = document.querySelector('form');
        let hiddenField = null;

        // ============================================
        // 完全隱藏 oTree 自動渲染的 mouse_tracking_data 字段
        // 包括字段本身、標籤和所有外層包裝元素
        // ============================================
        (function hideRenderedMouseField() {
            const field = document.querySelector('input[name="mouse_tracking_data"], textarea[name="mouse_tracking_data"]');
            if (!field) return;
            
            // 1. 隱藏字段本身
            field.style.display = 'none';
            field.setAttribute('aria-hidden', 'true');
            
            // 2. 隱藏關聯的 label（通過 for 屬性關聯）
            if (field.id) {
                const label = document.querySelector('label[for="' + field.id + '"]');
                if (label) {
                    label.style.display = 'none';
                    label.setAttribute('aria-hidden', 'true');
                }
            }
            
            // 3. 隱藏所有可能的外層包裝元素
            // oTree 可能使用 .form-group, .form-row, .mb-3 等 Bootstrap 類別
            let parent = field.parentElement;
            while (parent && parent !== form) {
                // 檢查是否是表單相關的包裝元素
                if (parent.classList.contains('form-group') ||
                    parent.classList.contains('form-row') ||
                    parent.classList.contains('form-control') ||
                    parent.classList.contains('mb-3') ||
                    parent.classList.contains('mb-2') ||
                    parent.classList.contains('field-wrapper') ||
                    parent.querySelector('label[for="' + (field.id || '') + '"]')) {
                    parent.style.display = 'none';
                    parent.setAttribute('aria-hidden', 'true');
                    break; // 只隱藏最近的包裝元素
                }
                parent = parent.parentElement;
            }
            
            console.log('✅ 已隱藏 oTree 渲染的 mouse_tracking_data 字段及其包裝元素');
        })();

        /**
         * 確保 mouse_tracking_data 欄位存在
         * 優先使用 oTree 已渲染的欄位（可能是 input 或 textarea）
         * 如果找不到才創建新的 hidden input
         * 
         * @returns {HTMLElement} mouse_tracking_data 欄位元素
         */
        function ensureHiddenField() {
            if (hiddenField) return hiddenField;
            if (!form) return null;
            
            // 優先使用 oTree 已經渲染的欄位（可能是 input 或 textarea）
            const existingField = document.querySelector('input[name="mouse_tracking_data"], textarea[name="mouse_tracking_data"]');
            if (existingField) {
                hiddenField = existingField;
                console.log('✅ 使用 oTree 渲染的 mouse_tracking_data 欄位:', existingField.tagName);
                return hiddenField;
            }
            
            // 如果沒有現成的，才創建新的 hidden input
            hiddenField = document.createElement('input');
            hiddenField.type = 'hidden';
            hiddenField.name = 'mouse_tracking_data';
            form.appendChild(hiddenField);
            console.log('✅ 創建新的 mouse_tracking_data hidden input');
            return hiddenField;
        }

        /**
         * 計算相對時間戳（秒）
         * @returns {number} 從頁面載入開始的秒數
         */
        function nowSeconds() {
            return Number(((performance.now() - start) / 1000).toFixed(1));
        }

        /**
         * 記錄事件到資料陣列
         * @param {string} eventType - 事件類型
         * @param {Event} evt - 事件物件（可為 null）
         */
        function record(eventType, evt) {
            const entry = {
                t: nowSeconds(),
                x: evt && typeof evt.clientX === 'number' ? evt.clientX : null,
                y: evt && typeof evt.clientY === 'number' ? evt.clientY : null,
                sx: window.scrollX || 0,
                sy: window.scrollY || 0,
                event: eventType,
                button: evt && typeof evt.button === 'number' ? evt.button : null,
            };
            data.push(entry);
            syncField();
        }

        /**
         * 記錄滑鼠移動事件（節流處理）
         * 每 1 秒記錄一次，避免資料量過大
         * @param {MouseEvent} evt - 滑鼠事件
         */
        function recordMove(evt) {
            const now = performance.now();
            if (now - lastMove < 1000) return;
            lastMove = now;
            record('move', evt);
        }

        /**
         * 同步資料到隱藏欄位
         * 將 data 陣列轉換為 JSON 並儲存
         */
        function syncField() {
            const field = ensureHiddenField();
            if (field) {
                field.value = JSON.stringify(data);
            }
        }

        // ============================================
        // 事件監聽器設置
        // ============================================
        
        // 初始化隱藏欄位
        ensureHiddenField();

        // 記錄滑鼠移動（節流處理）
        document.addEventListener('mousemove', recordMove, { passive: true });
        
        // 記錄點擊事件
        document.addEventListener('click', function (evt) { 
            record('click', evt); 
        });
        
        // 記錄頁面可見性變化
        document.addEventListener('visibilitychange', function () {
            record(document.visibilityState === 'hidden' ? 'page_hidden' : 'page_visible', null);
        });

        // 在表單提交時同步數據
        if (form) {
            form.addEventListener('submit', function() {
                syncField();
            }, true);
        }

        // 在頁面卸載前保存數據（導航或關閉）
        window.addEventListener('pagehide', syncField, { capture: true });
        window.addEventListener('beforeunload', syncField, { capture: true });
    });
</script>
{% endblock %}
