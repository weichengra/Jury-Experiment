{{ extends "global/Page.html" }}
{{ block title }}{{ endblock }}

{{ block styles }}
<style>
    /* 問題標籤（題目文字）的字體大小 */
    .control-label,
    .form-group > label,
    .form-group label,
    label[for^="id_demographic"],
    .otree-form-group label,
    .field > label {
        font-family: 'Times New Roman', serif !important;
        font-size: 20px !important;
        font-weight: normal !important;
        line-height: 1.6 !important;
        margin-bottom: 15px !important;
        display: block !important;
    }
    
    /* 大卡片式按鈕設計 */
    .form-check {
        border: 3px solid #ddd;
        padding: 25px 30px;
        border-radius: 12px;
        margin-bottom: 40px !important;
        cursor: pointer;
        transition: all 0.3s ease;
        background-color: #fff;
        position: relative;
    }
    
    .form-check:hover {
        border-color: #007bff;
        background-color: #f8f9fa;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(0, 123, 255, 0.15);
    }
    
    /* 確保卡片內的選項文字不受問題標籤規則影響 */
    .form-check label {
        cursor: pointer;
        font-size: 18px !important;
        margin: 0;
        padding-left: 10px;
        font-weight: 500 !important;
        color: #333;
        transition: color 0.3s ease;
        line-height: 1.6;
        display: inline !important;
    }
    
    .form-check input[type="radio"] {
        width: 22px;
        height: 22px;
        cursor: pointer;
        margin-right: 12px;
        vertical-align: middle;
    }
    
    /* 選中狀態的卡片樣式 */
    .form-check:has(input:checked) {
        border-color: #007bff;
        background-color: #e7f3ff;
        box-shadow: 0 4px 16px rgba(0, 123, 255, 0.25);
    }
    
    .form-check input:checked ~ label {
        font-weight: bold;
        color: #007bff;
    }
    
    /* 調整選項文字與按鈕的對齊 */
    .form-check-input {
        margin-top: 0.25rem;
    }
    
    /* 選項文字行高 */
    .form-check-label {
        line-height: 1.6;
        padding-left: 8px;
    }
    
    /* 未填寫題目的紅色邊框樣式 */
    .question-error {
        border: 2px solid #dc3545 !important;
        border-radius: 8px;
        padding: 15px;
        background-color: #fff5f5;
    }
    
    /* 警告訊息樣式 */
    .demographic-warning {
        font-family: 'Times New Roman', serif;
        font-size: 18px;
        color: #dc3545;
        background-color: #f8d7da;
        border: 2px solid #dc3545;
        border-radius: 8px;
        padding: 15px 20px;
        margin: 20px 0;
        display: none;
        font-weight: bold;
    }
    
    .demographic-warning.show {
        display: block;
    }
</style>
{{ endblock }}

{{ block content }}

<div id="demographic-warning" class="demographic-warning">
    ⚠ Please answer this question before continuing.
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 卡片點擊功能：點擊卡片內任意位置都能選中 radio button
    document.querySelectorAll('.form-check').forEach(function(card) {
        card.addEventListener('click', function(e) {
            // 如果點擊的不是 radio button 或 label，則手動觸發 radio button
            if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'LABEL') {
                const radio = card.querySelector('input[type="radio"]');
                if (radio && !radio.checked) {
                    radio.checked = true;
                    // 觸發 change 事件以確保所有監聽器都能收到通知
                    radio.dispatchEvent(new Event('change', { bubbles: true }));
                }
            }
        });
    });
    
    // 禁用原生表單驗證，允許問題可選填
    const form = document.querySelector('form');
    if (form) {
        form.setAttribute('novalidate', 'novalidate');
        form.querySelectorAll('input, textarea, select').forEach(function(input) {
            input.removeAttribute('required');
        });
    }
});
</script>
