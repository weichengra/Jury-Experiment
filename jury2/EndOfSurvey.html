<!-- reCAPTCHA Section -->

<!-- reCAPTCHA Script -->
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<script>
    function onRecaptchaSuccess(token) {
        document.getElementById('id_recaptcha_response').value = token;
        const recaptchaContainer = document.querySelector('.g-recaptcha');
        if (recaptchaContainer && recaptchaContainer.parentElement) {
            recaptchaContainer.parentElement.classList.remove('question-error');
        }
    }
</script>

<div style="margin: 8px 0;">
    <div class="g-recaptcha"
         data-sitekey="6LcGaDUsAAAAAHyj869iJQOmYB1jihzwku1Ffbxt"
         data-callback="onRecaptchaSuccess">
    </div>
</div>
<input type="hidden" name="recaptcha_response" id="id_recaptcha_response">

<br>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.querySelector('form');
    if (form) {
        form.addEventListener('submit', function(e) {
            let hasError = false;
            let firstErrorField = null;

            // 檢查 reCAPTCHA
            const recaptchaResponse = document.getElementById('id_recaptcha_response');
            if (!recaptchaResponse || !recaptchaResponse.value || recaptchaResponse.value.trim() === '') {
                hasError = true;
                const recaptchaContainer = document.querySelector('.g-recaptcha');
                if (recaptchaContainer && recaptchaContainer.parentElement) {
                    recaptchaContainer.parentElement.classList.add('question-error');
                    if (!firstErrorField) {
                        firstErrorField = recaptchaContainer.parentElement;
                    }
                }
            }

            if (hasError) {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                if (firstErrorField) {
                    setTimeout(function() {
                        const yOffset = -120;
                        const y = firstErrorField.getBoundingClientRect().top + window.pageYOffset + yOffset;
                        window.scrollTo({top: y, behavior: 'smooth'});
                    }, 100);
                }
                return false;
            }
        }, true);
    }
});
</script>
